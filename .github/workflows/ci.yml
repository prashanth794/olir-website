name: Website checks

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and validate production
        run: node scripts/build-site.mjs && node scripts/validate-site.mjs
      - name: Build and validate isolated preview
        run: |
          node -e "require('fs').copyFileSync('netlify.toml', 'dist/netlify.toml')"
          node scripts/build-site.mjs --preview
          node scripts/validate-site.mjs --preview
